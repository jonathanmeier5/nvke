apiVersion: v1
kind: Namespace
metadata:
  name: nvke-bootstrap-system
  labels:
    cluster.x-k8s.io/provider: bootstrap-nvke
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: nvke-bootstrap-controller-manager, namespace: nvke-bootstrap-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: nvke-bootstrap-controller-manager}
rules:
  - apiGroups: ["bootstrap.cluster.x-k8s.io"]
    resources: ["nvkeconfigs", "nvkeconfigtemplates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["bootstrap.cluster.x-k8s.io"]
    resources: ["nvkeconfigs/status"]
    verbs: ["get", "update", "patch"]
  # blockOwnerDeletion on the data secret requires update on the owner's finalizers.
  - apiGroups: ["bootstrap.cluster.x-k8s.io"]
    resources: ["nvkeconfigs/finalizers"]
    verbs: ["update"]
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters", "clusters/status", "machines", "machines/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: nvke-bootstrap-controller-manager}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: nvke-bootstrap-controller-manager}
subjects:
  - {kind: ServiceAccount, name: nvke-bootstrap-controller-manager, namespace: nvke-bootstrap-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: nvke-bootstrap-leader-election, namespace: nvke-bootstrap-system}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: nvke-bootstrap-leader-election, namespace: nvke-bootstrap-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: nvke-bootstrap-leader-election}
subjects:
  - {kind: ServiceAccount, name: nvke-bootstrap-controller-manager, namespace: nvke-bootstrap-system}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvke-bootstrap-controller-manager
  namespace: nvke-bootstrap-system
  labels: {cluster.x-k8s.io/provider: bootstrap-nvke}
spec:
  replicas: 1
  selector:
    matchLabels: {cluster.x-k8s.io/provider: bootstrap-nvke, control-plane: controller-manager}
  template:
    metadata:
      labels: {cluster.x-k8s.io/provider: bootstrap-nvke, control-plane: controller-manager}
    spec:
      serviceAccountName: nvke-bootstrap-controller-manager
      terminationGracePeriodSeconds: 10
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, effect: NoSchedule}
        - {key: node-role.kubernetes.io/master, effect: NoSchedule}
      containers:
        - name: manager
          image: nvke.local/bootstrap-provider:local
          imagePullPolicy: IfNotPresent
          # The site was built with --disable-mtls, so the worker matches it.
          # --container-nodes keeps NKE_LOCAL_DEV in the agent environment;
          # without it kubeadm fails preflight inside a nico-sim container.
          args: ["--leader-elect", "--disable-mtls", "--container-nodes"]
          livenessProbe: {httpGet: {path: /healthz, port: 8081}, initialDelaySeconds: 15, periodSeconds: 20}
          readinessProbe: {httpGet: {path: /readyz, port: 8081}, initialDelaySeconds: 5, periodSeconds: 10}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
