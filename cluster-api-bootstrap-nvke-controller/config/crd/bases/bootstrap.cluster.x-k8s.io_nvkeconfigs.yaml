---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    cluster.x-k8s.io/v1beta2: v1alpha1
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: nvkeconfigs.bootstrap.cluster.x-k8s.io
spec:
  group: bootstrap.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: NvkeConfig
    listKind: NvkeConfigList
    plural: nvkeconfigs
    singular: nvkeconfig
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NvkeConfig is the bootstrap configuration for one Machine.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NvkeConfigSpec is the bootstrap configuration for one Machine.

              The data secret this produces carries only what the host needs to boot,
              start nke-agent and attest. The kubeadm join configuration is not in it: the
              join is driven over gRPC once the agent answers, so the join material is
              never written to a secret at rest, and it is built after the control-plane
              endpoint is known rather than before.
            properties:
              attestationMethod:
                description: AttestationMethod selects the SPIRE node attestor. Defaults
                  to tpm.
                enum:
                - tpm
                - joinToken
                - dsxImds
                type: string
              kubeletExtraArgs:
                additionalProperties:
                  type: string
                description: KubeletExtraArgs are appended to the kubelet's flags
                  at join time.
                type: object
              nodeLabels:
                additionalProperties:
                  type: string
                description: NodeLabels are applied to the Kubernetes Node after it
                  joins.
                type: object
              nodeTaints:
                description: NodeTaints are applied to the Kubernetes Node after it
                  joins.
                items:
                  description: |-
                    corev1Taint mirrors corev1.Taint. It is declared here so the API package does
                    not pull k8s.io/api into every consumer; replace with corev1.Taint if that
                    dependency becomes unavoidable.
                  properties:
                    effect:
                      type: string
                    key:
                      type: string
                    value:
                      type: string
                  required:
                  - effect
                  - key
                  type: object
                type: array
            type: object
          status:
            description: |-
              NvkeConfigStatus reports the bootstrap contract's two signals plus the
              progress of the join this provider drives itself.
            properties:
              conditions:
                description: Conditions follows the Cluster API condition conventions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              dataSecretName:
                description: DataSecretName is the secret holding the boot configuration.
                type: string
              initialization:
                description: |-
                  Initialization reports dataSecretCreated, which is what the Machine
                  controller waits on before infrastructure is provisioned.
                properties:
                  dataSecretCreated:
                    description: DataSecretCreated is true once the secret exists
                      and is named above.
                    type: boolean
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
